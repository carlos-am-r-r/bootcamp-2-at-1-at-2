<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vitality | Autocuidado Gamificado</title>
</head>
<body>

    <header>
        <h1>Vitality</h1>
        <button type="button">Alternar Tema</button>
        
        <div>
            <progress value="0" max="100"></progress>
            <p>0% Concluído</p>
        </div>
    </header>

    <main>
        <ul>
            <li>Beber água (exemplo)</li>
        </ul>

        <form>
            <input type="text" placeholder="Adicionar novo hábito..." required>
            <button type="submit">Adicionar</button>
        </form>

        <hr>

        <section>
            <h2>Lembretes de Hidratação</h2>
            <div>
                <input type="time">
                <input type="time">
                <input type="time">
                <button type="button">Ativar Notificações</button>
            </div>
        </section>
    </main>

    <hr>

    <div>
        <h2>LEVEL UP!</h2>
        <p>Você completou todos os seus cuidados diários!</p>
    </div>

</body>
</html>
